name: APK Android

on:
  push:
    branches: ["**"]
    tags: ["v*"] # uma tag v* também publica o APK no release
    paths: &arquivos-do-app
      - "index.html"
      - "styles.css"
      - "main.js"
      - "img/**"
      - "sw.js"
      - "manifest.json"
      - "src-tauri/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths: *arquivos-do-app
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar como release com esta versão (ex.: v1.0.0). Vazio = só gera o APK."
        required: false
        default: ""

permissions:
  contents: write # para anexar o APK no release quando for uma tag v*

env:
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Instalar o Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Gerar o projeto Android
        run: |
          npx tauri android init --ci --skip-targets-install
          printf "\norg.gradle.daemon=false\nandroid.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL\n" >> src-tauri/gen/android/gradle.properties
          # aplica o icone da Bubu tambem no projeto Android recem-gerado
          npx tauri icon icon-512.png

      - name: Compilar o APK
        run: npx tauri android build --apk --target aarch64 armv7 --ci

      - name: Assinar o APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK_IN=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "APK gerado: $APK_IN"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chave.jks"
          else
            echo "::notice::Sem os secrets ANDROID_KEYSTORE_*: o APK foi assinado com uma chave temporaria. Ele instala normalmente, mas NAO vai dar pra atualizar por cima depois (teria que desinstalar e perder os dados). Veja o README para criar a chave fixa."
            KEYSTORE_PASSWORD=temporaria
            KEY_ALIAS=temporaria
            keytool -genkeypair -keystore "$RUNNER_TEMP/chave.jks" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -dname "CN=Remedios do Dudu"
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_IN" "$RUNNER_TEMP/alinhado.apk"
          export KEYSTORE_PASSWORD
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/chave.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out remedios-do-dudu.apk "$RUNNER_TEMP/alinhado.apk"
          "$BUILD_TOOLS/apksigner" verify remedios-do-dudu.apk
          rm -f "$RUNNER_TEMP/chave.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remedios-do-dudu-apk
          path: remedios-do-dudu.apk

      - name: Verificar tag de release
        id: tag
        run: |
          if [ -n "${{ inputs.release }}" ]; then
            echo "nome=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "nome=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VER="v$(node -p "JSON.parse(fs.readFileSync('./src-tauri/tauri.conf.json','utf8')).version")"
            if ! git rev-parse "$VER" >/dev/null 2>&1; then
              echo "nome=$VER" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Anexar ao release
        if: steps.tag.outputs.nome != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.nome }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: remedios-do-dudu.apk
