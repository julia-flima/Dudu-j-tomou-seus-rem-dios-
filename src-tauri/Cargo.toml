[package]
name = "remedios-do-dudu"
version = "1.8.0"
description = "Dudu já tomou seus remédios?"
edition = "2024"

[lib]
name = "remedios_do_dudu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-notification = "2.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
