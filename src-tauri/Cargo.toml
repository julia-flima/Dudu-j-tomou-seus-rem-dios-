[package]
name = "remedios-do-dudu"
version = "1.0.0"
description = "Dudu já tomou seus remédios?"
edition = "2021"

[lib]
name = "remedios_do_dudu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
